name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur
        run: npm test

      - name: Build web
        run: npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk terrafront-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: terrafront-apk
          path: terrafront-debug.apk
          if-no-files-found: error
